<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <title>เข้าร่วมห้องประชุม {{ROOM_ID}}</title>
  <meta property="og:title" content="เชิญเข้าร่วมห้องประชุม {{ROOM_ID}}">
  <meta property="og:description" content="เข้าร่วมผ่านเบราว์เซอร์ได้ทันที ไม่ต้องติดตั้งแอป">
</head>
<body>
  <main class="page">
    <div class="page-inner">
      <h1>คุณได้รับเชิญเข้าห้องประชุม</h1>
      <p class="lead">เข้าร่วมผ่านเบราว์เซอร์ได้ทันที ไม่ต้องติดตั้งแอป</p>
      <p class="room-code">{{ROOM_ID}}</p>

      <div class="stack">
        <a class="btn btn-primary" id="joinLink" href="/room/{{ROOM_ID}}">เข้าร่วมผ่านเบราว์เซอร์</a>
        <button class="btn btn-quiet" id="copyBtn" type="button">คัดลอกลิงก์เชิญ</button>
      </div>

      <p class="note" id="note"></p>
    </div>
  </main>

  <script>
    (function () {
      var roomId = decodeURIComponent(location.pathname.split('/')[2] || '');
      var note = document.getElementById('note');
      var joinLink = document.getElementById('joinLink');

      // เช็กว่าผู้สร้างห้องสร้างห้องนี้ไว้แล้วหรือยัง
      fetch('/api/rooms/' + encodeURIComponent(roomId) + '/status', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (s) {
          if (!s.exists) {
            joinLink.hidden = true;
            note.textContent = 'ไม่พบห้องประชุมนี้ ตรวจสอบลิงก์อีกครั้ง หรือขอลิงก์ใหม่จากผู้สร้างห้อง';
          } else if (s.participants === 0) {
            note.textContent = 'ยังไม่มีใครอยู่ในห้อง เข้าไปรอผู้สร้างห้องได้เลย';
          } else {
            note.textContent = 'ตอนนี้มีผู้เข้าร่วม ' + s.participants + ' คน';
          }
        })
        .catch(function () { /* เช็กไม่ได้ ให้ลองเข้าห้องตามปกติ */ });

      document.getElementById('copyBtn').addEventListener('click', function () {
        var btn = this;
        var url = location.origin + '/join/' + encodeURIComponent(roomId);
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(function () {
            btn.textContent = 'คัดลอกลิงก์แล้ว';
          }, function () { window.prompt('คัดลอกลิงก์นี้', url); });
        } else {
          window.prompt('คัดลอกลิงก์นี้', url);
        }
      });
    })();
  </script>
</body>
</html>
