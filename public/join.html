<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <title>เข้าร่วมห้องประชุม {{ROOM_ID}}</title>
  <meta property="og:title" content="เชิญเข้าร่วมห้องประชุม {{ROOM_ID}}">
  <meta property="og:description" content="เข้าร่วมผ่านเบราว์เซอร์ได้ทันที ไม่ต้องติดตั้งแอป">
</head>
<body>
  <main class="page">
    <div class="page-inner">
      <h1>คุณได้รับเชิญเข้าห้องประชุม</h1>
      <p class="lead">เข้าร่วมผ่านเบราว์เซอร์ได้ทันที ไม่ต้องติดตั้งแอป</p>
      <p class="room-code">{{ROOM_ID}}</p>

      <div class="stack">
        <a class="btn btn-primary" href="/room/{{ROOM_ID}}">เข้าร่วมผ่านเบราว์เซอร์</a>
        <!-- แสดงเฉพาะบน Android: href ถูกสร้างใน script ด้านล่าง -->
        <a class="btn btn-quiet" id="openApp" hidden
           data-scheme="{{APP_SCHEME}}" data-package="{{APP_PACKAGE}}">เปิดในแอป</a>
        <button class="btn btn-quiet" id="copyBtn" type="button">คัดลอกลิงก์เชิญ</button>
      </div>

      <p class="note" id="note"></p>
    </div>
  </main>

  <script>
    (function () {
      var roomId = decodeURIComponent(location.pathname.split('/')[2] || '');
      var openApp = document.getElementById('openApp');
      var note = document.getElementById('note');

      if (/Android/i.test(navigator.userAgent)) {
        // fallback ต้องเป็น URL เต็ม (http/https) ไม่อย่างนั้น Chrome จะพาไป Play Store แทน
        var fallback = location.origin + '/join/' + encodeURIComponent(roomId) + '?noapp=1';
        openApp.href = 'intent://join/' + encodeURIComponent(roomId)
          + '#Intent;scheme=' + openApp.dataset.scheme
          + ';package=' + openApp.dataset.package
          + ';S.browser_fallback_url=' + encodeURIComponent(fallback)
          + ';end';
        openApp.hidden = false;
      }

      if (new URLSearchParams(location.search).has('noapp')) {
        openApp.hidden = true;
        note.textContent = 'ไม่พบแอปในเครื่องนี้ เข้าร่วมผ่านเบราว์เซอร์แทนได้เลย';
      }

      document.getElementById('copyBtn').addEventListener('click', function () {
        var btn = this;
        var url = location.origin + '/join/' + encodeURIComponent(roomId);
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(function () {
            btn.textContent = 'คัดลอกลิงก์แล้ว';
          }, function () { window.prompt('คัดลอกลิงก์นี้', url); });
        } else {
          window.prompt('คัดลอกลิงก์นี้', url);
        }
      });
    })();
  </script>
</body>
</html>
