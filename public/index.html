<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <title>เข้าห้องประชุม</title>
</head>
<body>
  <main class="page">
    <div class="page-inner">
      <h1>เข้าห้องประชุม</h1>
      <p class="lead">กรอก Room ID หรือเปิดลิงก์เชิญที่ได้รับจากผู้สร้างห้อง ห้องประชุมสร้างได้จากแอปบนมือถือเท่านั้น</p>

      <form id="joinForm" class="stack" novalidate>
        <label class="field-label" for="roomInput">Room ID</label>
        <input id="roomInput" class="field" maxlength="32" placeholder="เช่น team-meeting"
               autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        <p id="formError" class="error" role="alert"></p>
        <button class="btn btn-primary" type="submit">เข้าร่วม</button>
      </form>
    </div>
  </main>

  <script>
    (function () {
      var ROOM_ID_RE = /^[A-Za-z0-9_-]{1,32}$/;
      var input = document.getElementById('roomInput');
      var error = document.getElementById('formError');

      document.getElementById('joinForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var roomId = input.value.trim();
        if (!roomId) { error.textContent = 'กรอก Room ID ก่อนเข้าร่วม'; input.focus(); return; }
        if (!ROOM_ID_RE.test(roomId)) {
          error.textContent = 'Room ID ใช้ได้เฉพาะ a-z, 0-9, - และ _ ไม่เกิน 32 ตัว';
          input.focus();
          return;
        }
        location.href = '/room/' + encodeURIComponent(roomId);
      });

    })();
  </script>
</body>
</html>
